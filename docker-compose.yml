services:
  db:
    image: postgres:16-alpine
    container_name: karmei_gat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-findmyapprtment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-findmyapprtment}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karmei_gat_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-findmyapprtment}?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-your_bot_token_here}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-your_chat_id_here}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 * * * *}
      TARGET_CITY: ${TARGET_CITY:-קרית גת}
      TARGET_CITY_SLUG: ${TARGET_CITY_SLUG:-kiryat-gat}
      TARGET_DISTRICT: ${TARGET_DISTRICT:-כרמי גת}
      TARGET_DISTRICT_SLUG: ${TARGET_DISTRICT_SLUG:-karmei-gat}
      PORT: 3000
    ports:
      - "3004:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    name: karmei_gat_pgdata
